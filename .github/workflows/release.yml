name: release

# Pushing a tag builds the binaries and publishes them on the release.
#
# `workflow_dispatch` runs everything except the publishing, so the build
# matrix can be exercised without spending a tag on finding out it is broken.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never

# Actions are pinned by commit SHA. Update them deliberately, never by tag.
jobs:
  verify:
    name: verify the commit being released
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      # `ci.yml` runs on pushes to main and on pull requests, neither of which
      # covers a tag. A tag can name any commit, so it is checked here too
      # rather than assumed to have been checked already.
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: cargo test
        run: cargo test --all-features
      - name: the tag must name the version it builds
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -eu
          tag="${GITHUB_REF_NAME#v}"
          # Three places carry the version and all three ship in the release,
          # so all three have to agree with the tag.
          cli=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "rpi-provision") | .version')
          gui=$(cargo metadata --no-deps --format-version 1 --manifest-path gui/Cargo.toml \
            | jq -r '.packages[] | select(.name == "rpi-provision-gui") | .version')
          conf=$(jq -r '.version' gui/src-tauri/tauri.conf.json)
          failed=0
          for pair in "workspace:$cli" "gui:$gui" "tauri.conf.json:$conf"; do
            what="${pair%%:*}"
            found="${pair#*:}"
            if [ "$found" != "$tag" ]; then
              echo "::error::${what} says ${found}, but the tag says ${tag}" >&2
              failed=1
            fi
          done
          [ "$failed" = 0 ] || exit 1
          echo "tag ${GITHUB_REF_NAME} matches all three version declarations"

  draft:
    name: open the release
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # `--generate-notes` summarises what has landed since the previous
          # tag, which it can only do with the history to compare against.
          fetch-depth: 0
      - name: create it as a draft
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Nothing is visible until every binary has been attached, so a
          # failed build leaves no half-populated release behind. Re-running
          # the workflow for the same tag reuses the draft rather than failing.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release ${GITHUB_REF_NAME} already exists; reusing it"
          else
            gh release create "$GITHUB_REF_NAME" \
              --draft \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi

  build:
    name: ${{ matrix.target }}
    needs: draft
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-musl }
          - { os: ubuntu-24.04, target: aarch64-unknown-linux-musl }
          - { os: windows-2022, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.95.0
          targets: ${{ matrix.target }}
      - name: install the cross linker
        if: startsWith(matrix.target, 'aarch64-unknown-linux')
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            gcc-aarch64-linux-gnu musl-tools
      - name: build
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release --locked --target ${{ matrix.target }}

      # bash on every runner, Windows included, so this is one script rather
      # than one per platform.
      - name: name the binary after what it runs on
        id: asset
        shell: bash
        run: |
          set -eu
          suffix=""
          if [ "${{ matrix.os }}" = "windows-2022" ]; then
            suffix=".exe"
          fi
          built="target/${{ matrix.target }}/release/rpi-provision${suffix}"
          [ -f "$built" ] || { echo "::error::${built} was not produced" >&2; exit 1; }
          name="rpi-provision-${GITHUB_REF_NAME}-${{ matrix.target }}${suffix}"
          mkdir -p dist
          cp "$built" "dist/${name}"
          echo "name=${name}" >>"$GITHUB_OUTPUT"
          ls -l "dist/${name}"

      - name: it must at least run
        shell: bash
        if: matrix.target != 'aarch64-unknown-linux-musl'
        run: |
          # A binary that cannot print its own version is not worth shipping.
          # The aarch64 build is cross compiled and cannot run here.
          "dist/${{ steps.asset.outputs.name }}" version

      - name: attach it to the release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" "dist/${{ steps.asset.outputs.name }}" --clobber

  bundle:
    name: desktop application (${{ matrix.bundle }})
    needs: draft
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, bundle: deb, extension: deb }
          - { os: windows-2022, bundle: msi, extension: msi }
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.95.0
      - name: install the webview
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev
      # From crates.io rather than from a third-party action: the bundler is
      # the only extra tool needed, and this keeps the release to the two
      # actions the rest of the repository already pins.
      - name: install the tauri bundler
        run: cargo install tauri-cli --version "^2" --locked
      - name: bundle
        working-directory: gui
        run: cargo tauri build --bundles ${{ matrix.bundle }}

      - name: name the bundle after the release
        id: asset
        shell: bash
        run: |
          set -eu
          built=$(find gui/target/release/bundle -name "*.${{ matrix.extension }}" -type f | head -n 1)
          [ -n "$built" ] || { echo "::error::no .${{ matrix.extension }} was produced" >&2; exit 1; }
          name="rpi-provision-gui-${GITHUB_REF_NAME}-${{ matrix.bundle }}.${{ matrix.extension }}"
          mkdir -p dist
          cp "$built" "dist/${name}"
          echo "name=${name}" >>"$GITHUB_OUTPUT"
          ls -l "dist/${name}"

      - name: the package must declare what it needs to run
        if: matrix.os == 'ubuntu-24.04'
        shell: bash
        run: |
          # A .deb that does not depend on the webview installs and then fails
          # to start, which is worse than not shipping one.
          depends=$(dpkg-deb -f "dist/${{ steps.asset.outputs.name }}" Depends)
          echo "Depends: ${depends}"
          case "$depends" in
            *libwebkit2gtk*) ;;
            *) echo "::error::the package does not depend on the webview" >&2; exit 1 ;;
          esac
          dpkg-deb -c "dist/${{ steps.asset.outputs.name }}" | grep -q 'usr/bin/rpi-provision-gui'

      - name: attach it to the release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" "dist/${{ steps.asset.outputs.name }}" --clobber

  publish:
    name: publish the release
    needs: [build, bundle]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: checksum every attached binary
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          mkdir -p assets && cd assets
          gh release download "$GITHUB_REF_NAME" --pattern 'rpi-provision-*'
          sha256sum rpi-provision-* >SHA256SUMS
          cat SHA256SUMS
          gh release upload "$GITHUB_REF_NAME" SHA256SUMS --clobber
      - name: make it visible
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest
